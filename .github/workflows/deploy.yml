name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Sync sitemap and cache version
        run: |
          VERSION=$(grep -oP '(?<=<meta name="version" content=")[^"]*' app/index.html)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>$(date +%Y-%m-%d)</lastmod>|" app/sitemap.xml
          sed -i "s|\(CACHE_PREFIX + 'v\)[^']*'|\1$VERSION'|" app/sw.js
          git add app/sitemap.xml app/sw.js
          git diff --cached --quiet && exit 0
          git config --local user.name "$(git log -1 --format=%an)"
          git config --local user.email "$(git log -1 --format=%ae)"
          git commit -C HEAD --no-verify
          git push origin "HEAD:$GITHUB_REF_NAME" || echo "::warning::Could not push synced files"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
